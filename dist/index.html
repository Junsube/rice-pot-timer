<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16201f">
  <title>맛있는 밥 타이머</title>
  <meta name="description" content="냄비밥을 위한 단계별 조리 타이머">
  <style>
    :root { --ink:#16201f; --panel:#f8f6f0; --paper:#fffdf9; --line:#ddd8ce; --muted:#6e716c; --fire:#d85a30; --gold:#f4c65b; --green:#688d78; }
    :root { color-scheme:light; --page:#fff; --timer:#f3f5f3; --timer-text:#16201f; --timer-muted:#526156; --track:#d9dfdb }
    :root[data-theme="dark"] { color-scheme:dark; --ink:#edf3ef; --paper:#202a27; --line:#44534c; --muted:#b7c3bb; --page:#111a17; --timer:#202e27; --timer-text:#f5f8f5; --timer-muted:#c9d8c9; --track:#ffffff26 }
    * { box-sizing:border-box } body { margin:0; min-width:320px; background:#e9e6de; color:var(--ink); font-family:"Pretendard Variable","Noto Sans KR",system-ui,sans-serif; }
    button,input { font:inherit } button { cursor:pointer } .app { max-width:760px; min-height:100dvh; margin:auto; padding:22px 18px 36px; }
    header { display:flex; justify-content:space-between; align-items:center; margin:0 2px 20px } .brand { font-size:1.05rem; font-weight:800; letter-spacing:-.04em } .badge { padding:7px 10px; border-radius:999px; background:#dce9df; color:#38604b; font-size:.76rem; font-weight:800 }
    .timer { position:relative; overflow:hidden; padding:28px 25px 24px; border-radius:28px; color:#fffdf9; background:var(--ink); box-shadow:0 14px 28px #1b292522; }
    .timer:after { content:""; position:absolute; right:-48px; top:-62px; width:170px; height:170px; border:1px solid #ffffff2e; border-radius:50%; box-shadow:0 0 0 22px #ffffff0b, 0 0 0 44px #ffffff08; }
    .eyebrow { position:relative; z-index:1; color:#c9d8c9; font-size:.84rem; font-weight:700; letter-spacing:.02em } .stage { position:relative; z-index:1; margin:9px 0 4px; font-size:clamp(2rem,10vw,3.7rem); letter-spacing:-.08em; line-height:1.1 } .remaining { position:relative; z-index:1; font-variant-numeric:tabular-nums; font-size:clamp(4rem,20vw,7rem); line-height:1; letter-spacing:-.09em; font-weight:800 }
    .progress { height:7px; margin:24px 0 10px; overflow:hidden; border-radius:999px; background:#ffffff26 }.progress > i { display:block; height:100%; width:0%; border-radius:inherit; background:var(--gold); transition:width .4s linear }.total { position:relative; z-index:1; color:#d6ded4; font-size:.84rem }
    .controls { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px }.controls button { min-height:55px; border:0; border-radius:16px; font-weight:800 }.primary { background:var(--fire); color:#fff }.secondary { background:var(--paper); color:var(--ink); border:1px solid var(--line)!important }.primary:active,.secondary:active { transform:translateY(1px) }
    .alert-setting { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; padding:13px 15px; border:1px solid var(--line); border-radius:16px; background:var(--paper) }.alert-copy strong { display:block; font-size:.9rem; letter-spacing:-.03em }.alert-copy span { display:block; margin-top:3px; color:var(--muted); font-size:.76rem }.alert-actions { display:flex; align-items:center; gap:7px }.warning-choice { display:flex; overflow:hidden; border:1px solid var(--line); border-radius:10px }.warning-choice button { min-width:38px; padding:6px 7px; border:0; border-left:1px solid var(--line); color:var(--muted); background:#fff; font-size:.75rem; font-weight:800 }.warning-choice button:first-child { border-left:0 }.warning-choice button.selected { color:#fff; background:var(--green) }.switch { position:relative; width:42px; height:25px; flex:0 0 auto }.switch input { position:absolute; opacity:0; width:1px; height:1px }.slider { position:absolute; inset:0; border-radius:999px; background:#c9cbc6; transition:.2s }.slider:before { content:""; position:absolute; left:3px; top:3px; width:19px; height:19px; border-radius:50%; background:#fff; box-shadow:0 1px 3px #0003; transition:.2s }.switch input:checked + .slider { background:var(--green) }.switch input:checked + .slider:before { transform:translateX(17px) }.switch input:focus-visible + .slider { outline:2px solid var(--fire); outline-offset:2px }
    .section-title { margin:30px 2px 12px; font-size:1.05rem; letter-spacing:-.04em }.steps { display:grid; gap:8px }.step { display:grid; grid-template-columns:32px 1fr auto; align-items:center; gap:10px; padding:13px; border-radius:16px; background:var(--paper); border:1px solid transparent }.step.active { border-color:#e99b7f; background:#fff8f5 }.step.done { opacity:.55 }.flame { width:30px; height:30px; display:grid; place-items:center; border-radius:10px; background:#f4eee5; font-size:1rem }.step.active .flame { background:#fbe0d5 }.step-name { font-weight:750; letter-spacing:-.03em }.step small { display:block; margin-top:2px; color:var(--muted); font-size:.74rem }.time-edit { display:flex; align-items:center; gap:5px; padding:5px 7px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:#fff }.time-edit input { width:28px; border:0; padding:0; text-align:center; background:transparent; font-weight:800; outline:0 }.time-edit span { color:var(--muted); font-size:.78rem }
    .water { margin-top:28px; padding:19px; border-radius:22px; background:#dce9df }.water h2 { margin:0 0 5px; font-size:1.06rem; letter-spacing:-.04em }.water p { margin:0; color:#41614c; font-size:.85rem; line-height:1.55 }.water-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px }.guide { padding:12px 10px; border-radius:14px; background:#f8fcf8; min-width:0 }.guide strong { display:block; margin-bottom:5px; font-size:.8rem }.guide span { display:block; color:#43614d; font-size:.78rem; line-height:1.4; word-break:keep-all }.note { margin:12px 2px 0; color:var(--muted); font-size:.74rem; line-height:1.55 }.complete { color:#fff; background:#47735a }.complete .eyebrow { color:#d5ebdb }
    @media (max-width:480px) { .app { padding:16px 14px 28px }.timer { padding:24px 20px 21px; border-radius:24px }.water-grid { grid-template-columns:1fr }.guide { display:grid; grid-template-columns:76px 1fr; gap:8px; align-items:center }.guide strong { margin:0 }.step { grid-template-columns:29px 1fr auto; padding:11px }.time-edit { gap:2px; padding:5px }.section-title { margin-top:26px } }
    body { background:var(--page) }.timer { background:var(--timer); color:var(--timer-text) }.eyebrow,.total { color:var(--timer-muted) }.progress { background:var(--track) }.progress > i { background:var(--green) }.complete { background:#47735a; color:#fff }.complete .total { color:#d5ebdb }
    .theme-button { padding:8px 12px; border:1px solid var(--line); border-radius:10px; background:var(--paper); color:var(--ink); font-size:.875rem }.header-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap }.setting { margin-top:12px; padding:14px 15px; border:1px solid var(--line); border-radius:16px; background:var(--paper) }.setting-title { font-size:.9rem; font-weight:750 }.delay-options { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:10px }.delay-options button { min-height:40px; padding:8px 12px; border:1px solid var(--line); border-radius:10px; background:var(--paper); color:var(--ink) }.delay-options button.selected { background:var(--green); color:#fff }.delay-options label { display:flex; align-items:center; gap:7px; font-size:.875rem }.delay-options input { width:64px; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink) }.delay-options input:disabled { opacity:.5 }.setting p { margin:8px 0 0; color:var(--muted); font-size:.875rem }.alert-setting { flex-wrap:wrap }.warning-choice button,.time-edit { background:var(--paper); color:var(--ink) } button:focus-visible,input:focus-visible { outline:2px solid var(--fire); outline-offset:3px }
    [data-theme="dark"] .step.active { background:#362b24; border-color:#c8815d } [data-theme="dark"] .flame { background:#344038 } [data-theme="dark"] .step.active .flame { background:#57362c } [data-theme="dark"] .water,[data-theme="dark"] .badge { background:#263e30; color:#e0f0e3 } [data-theme="dark"] .water p,[data-theme="dark"] .guide span { color:#c4d9c9 } [data-theme="dark"] .guide { background:#1b2c22 }
  </style>
</head>
<body>
  <main class="app">
    <header><div class="brand">맛있는 밥</div><div class="header-actions"><div class="badge">냄비밥 타이머</div><button class="theme-button" id="themeBtn" type="button">다크 모드</button></div></header>
    <section class="timer" id="timerCard" aria-live="polite">
      <div class="eyebrow" id="stageCount">1 / 4 단계</div>
      <h1 class="stage" id="stageName">강불</h1>
      <div class="remaining" id="remaining">03:00</div>
      <div class="progress"><i id="progressBar"></i></div>
      <div class="total" id="totalTime">전체 20분</div>
    </section>
    <div class="controls">
      <button class="primary" id="startBtn" type="button">밥 짓기 시작</button>
      <button class="secondary" id="resetBtn" type="button">처음부터</button>
    </div>
    <section class="setting" aria-labelledby="delayTitle">
      <div class="setting-title" id="delayTitle">시작 전 준비 시간</div>
      <div class="delay-options" aria-label="준비 시간 선택">
        <button type="button" data-delay="5">5초</button><button type="button" data-delay="10">10초</button><button type="button" data-delay="custom">직접 입력</button>
        <label><input id="customDelay" type="number" min="0" max="300" step="1" inputmode="numeric" aria-label="직접 입력 준비 시간"><span>초</span></label>
      </div>
      <p id="delayDescription">시작을 누른 뒤 불을 켜러 갈 시간이에요</p>
    </section>
    <section class="alert-setting" aria-labelledby="alertTitle">
      <div class="alert-copy"><strong id="alertTitle">불 줄이기 미리 알림</strong><span id="alertDescription">다음 단계 10초 전에 소리로 알려드려요</span></div>
      <div class="alert-actions">
        <div class="warning-choice" aria-label="미리 알림 시간"><button type="button" data-warning="5">5초</button><button type="button" data-warning="10">10초</button></div>
        <label class="switch" aria-label="불 줄이기 미리 알림 켜기"><input id="warningToggle" type="checkbox" checked><span class="slider"></span></label>
      </div>
    </section>
    <h2 class="section-title">조리 순서</h2>
    <div class="steps" id="steps"></div>
    <section class="water" aria-labelledby="waterTitle">
      <h2 id="waterTitle">물양 안내</h2><p>쌀 1컵(약 180ml) 기준의 시작점입니다</p>
      <div class="water-grid">
        <div class="guide"><strong>계량컵</strong><span>물 약 220ml</span></div>
        <div class="guide"><strong>종이컵</strong><span>약 1컵 + 조금</span></div>
        <div class="guide"><strong>눈대중</strong><span>쌀 표면보다 약 1cm 위</span></div>
      </div>
      <p class="note">쌀 종류·불림 시간·냄비에 따라 달라질 수 있어요. 처음에는 이 기준으로 해 보고, 다음번에 내 냄비에 맞춰 조절해 보세요</p>
    </section>
  </main>
  <script>
    const defaults = [
      { name:'강불', hint:'끓기 시작할 때까지', minutes:3, icon:'🔥' },
      { name:'중불', hint:'물기가 줄어들 때까지', minutes:5, icon:'♨️' },
      { name:'약불', hint:'속까지 고르게 익히기', minutes:7, icon:'◌' },
      { name:'뜸들이기', hint:'불을 끄고 기다리기', minutes:5, icon:'◒' }
    ];
    let steps = structuredClone(defaults), current = 0, remaining = steps[0].minutes * 60, running = false, timer = null;
    let warningEnabled = localStorage.getItem('riceWarningEnabled') !== 'false';
    let warningSeconds = Number(localStorage.getItem('riceWarningSeconds')) === 5 ? 5 : 10;
    let delayChoice = ['5','10','custom'].includes(localStorage.getItem('riceDelayChoice')) ? localStorage.getItem('riceDelayChoice') : '10';
    const clampDelay = value => Math.max(0,Math.min(300,Math.round(Number(value)||0)));
    let customDelay = clampDelay(localStorage.getItem('riceCustomDelay') ?? 10), preparation = 0, started = false, audio = null;
    let theme = localStorage.getItem('riceTheme') === 'dark' ? 'dark' : 'light';
    const $ = id => document.getElementById(id); const fmt = n => `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
    function totalSeconds() { return steps.reduce((sum, step) => sum + step.minutes * 60, 0) }
    function unlockAudio() { try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); audio.resume().catch(() => {}) } catch (_) {} }
    function sound() { try { if(!audio) return; const o=audio.createOscillator(), g=audio.createGain(); o.connect(g); g.connect(audio.destination); o.frequency.setValueAtTime(784,audio.currentTime); g.gain.setValueAtTime(.08,audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.45); o.start(); o.stop(audio.currentTime+.45); o.onended=()=>{ o.disconnect(); g.disconnect() } } catch (_) {} }
    function renderSteps() { $('steps').innerHTML = steps.map((s,i) => `<div class="step ${i===current?'active':''} ${i<current?'done':''}"><div class="flame">${s.icon}</div><div><div class="step-name">${s.name}</div><small>${s.hint}</small></div><label class="time-edit" aria-label="${s.name} 시간"><input type="number" min="1" max="99" value="${s.minutes}" data-index="${i}"><span>분</span></label></div>`).join(''); document.querySelectorAll('.time-edit input').forEach(input => input.addEventListener('change', e => { const i=+e.target.dataset.index, val=Math.max(1,Math.min(99,Number(e.target.value)||1)); steps[i].minutes=val; e.target.value=val; if(i===current && !running) remaining=val*60; render(); })); }
    function renderWarning() { $('warningToggle').checked=warningEnabled; $('alertDescription').textContent=warningEnabled ? `다음 단계 ${warningSeconds}초 전에 소리로 알려드려요` : '미리 알림이 꺼져 있어요'; document.querySelectorAll('[data-warning]').forEach(button => button.classList.toggle('selected', Number(button.dataset.warning)===warningSeconds)); }
    function renderSettings() {
      document.documentElement.dataset.theme=theme;
      $('themeBtn').textContent=theme==='dark' ? '화이트 모드' : '다크 모드';
      document.querySelector('meta[name="theme-color"]').content=theme==='dark' ? '#111a17' : '#ffffff';
      document.querySelectorAll('[data-delay]').forEach(button => { button.classList.toggle('selected',button.dataset.delay===delayChoice); button.setAttribute('aria-pressed',button.dataset.delay===delayChoice); button.disabled=started });
      $('customDelay').value=customDelay; $('customDelay').disabled=started || delayChoice!=='custom';
      $('delayDescription').textContent=started ? '준비 시간은 처음부터 시작할 때 적용돼요' : '시작을 누른 뒤 불을 켜러 갈 시간이에요';
    }
    function render() { const done = current >= steps.length; const step = steps[Math.min(current,steps.length-1)]; $('timerCard').classList.toggle('complete',done); $('stageCount').textContent=preparation>0 ? '불을 켜고 준비해 주세요' : done ? '완료' : `${current+1} / ${steps.length} 단계`; $('stageName').textContent=preparation>0 ? '시작 준비' : done ? '맛있게 드세요' : step.name; $('remaining').textContent=done ? '완료' : fmt(preparation || remaining); const duration=step.minutes*60; $('progressBar').style.width=done?'100%':preparation>0?'0%':`${Math.max(0,Math.min(100,(1-remaining/duration)*100))}%`; $('totalTime').textContent=`전체 ${Math.round(totalSeconds()/60)}분`; $('startBtn').textContent=done ? '다시 시작' : running ? '일시정지' : started ? '계속하기' : '밥 짓기 시작'; renderSteps(); renderWarning(); renderSettings(); }
    function tick() {
      if(preparation>0) { preparation--; if(preparation===0) sound(); render(); return }
      remaining--;
      if(warningEnabled && current < steps.length-1 && remaining===warningSeconds) sound();
      if(remaining<=0) { sound(); current++; if(current>=steps.length) { running=false; clearInterval(timer); timer=null } else remaining=steps[current].minutes*60 }
      render();
    }
    function reset() { running=false; clearInterval(timer); timer=null; current=0; remaining=steps[0].minutes*60; preparation=0; started=false; render() }
    $('startBtn').addEventListener('click', () => { unlockAudio(); if(current>=steps.length) reset(); if(!started) { preparation=delayChoice==='custom' ? customDelay : Number(delayChoice); started=true } running=!running; if(running) timer=setInterval(tick,1000); else clearInterval(timer); render() });
    $('themeBtn').addEventListener('click', () => { theme=theme==='dark' ? 'light' : 'dark'; localStorage.setItem('riceTheme',theme); renderSettings() });
    document.querySelectorAll('[data-delay]').forEach(button => button.addEventListener('click', () => { delayChoice=button.dataset.delay; localStorage.setItem('riceDelayChoice',delayChoice); renderSettings(); if(delayChoice==='custom') $('customDelay').focus() }));
    $('customDelay').addEventListener('change', e => { customDelay=clampDelay(e.target.value); localStorage.setItem('riceCustomDelay',customDelay); renderSettings() });
    $('warningToggle').addEventListener('change', e => { warningEnabled=e.target.checked; localStorage.setItem('riceWarningEnabled', warningEnabled); renderWarning() });
    document.querySelectorAll('[data-warning]').forEach(button => button.addEventListener('click', () => { warningSeconds=Number(button.dataset.warning); localStorage.setItem('riceWarningSeconds', warningSeconds); renderWarning() }));
    $('resetBtn').addEventListener('click', reset); render();
  </script>
</body>
</html>
